name: GreatcatNote Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "android-lite/**"
      - ".github/workflows/greatcatnote-android.yml"

permissions:
  contents: read

concurrency:
  group: greatcatnote-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build personal APK
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: android-lite

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Test and build APK
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug

      - name: Name APK
        run: cp app/build/outputs/apk/debug/app-debug.apk GreatcatNote-Mobile-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: GreatcatNote-Mobile-APK
          path: android-lite/GreatcatNote-Mobile-debug.apk
          if-no-files-found: error
          retention-days: 30
